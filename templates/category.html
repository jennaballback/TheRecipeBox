<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category }} Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    {% include 'header.html' %}

    <div class="container mt-4">
        <h1>{{ category }} Recipes</h1>

        {% if not recipes %}
            <p>No {{ category }} recipes found.</p>
        {% endif %}

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for recipe in recipes %}
            <div class="col">
                <a href="{{ url_for('recipe_details', id=recipe['id']) }}" class="card-link">
                    <div class="card h-100">
                        <img src="{{ recipe['image'] if recipe['image'] else url_for('static', filename='images/placeholder.png') }}" class="card-img-top" alt="{{ recipe['name'] }}">
                        <div class="card-body text-center">
                            <h5 class="card-title">{{ recipe['name'] }}</h5>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

    {% include 'scripts.html' %}
</body>
</html>
